[project]
name = "market-research-agents"
version = "0.1.0"
description = "Multi-agent market research memo generator built on authored MCP servers (research/education only, not investment advice)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_servers", "agents", "core"]
